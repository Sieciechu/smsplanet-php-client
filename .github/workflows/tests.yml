name: Tests

on:
  push:
    branches: [master]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']
        guzzle: ['^7.9', '^8.0']
    name: PHP ${{ matrix.php }} / Guzzle ${{ matrix.guzzle }}
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, simplexml, fileinfo
          coverage: none
      - name: Install dependencies
        run: composer require "guzzlehttp/guzzle:${{ matrix.guzzle }}" --no-interaction --no-progress --update-with-all-dependencies
      - name: Run tests
        run: composer test
